<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Lulo’s Gelato</title>
<meta name="robots" content="noindex">
<script>
  // GitHub Pages / hospedagens estáticas: /sabores/<slug> vira sabor.html?s=<slug> (funciona também dentro de /<repositorio>/)
  (function () {
    var m = location.pathname.match(/^(.*?)\/sabores\/([^\/]+)\/?$/);
    if (m) location.replace(m[1] + '/sabor.html?s=' + encodeURIComponent(decodeURIComponent(m[2])));
  })();
</script>
<style>
  html,body{margin:0;height:100%;background:#FFECCE;color:#7C1414;font-family:"Futura LT Pro",Futura,"Century Gothic",Arial,sans-serif;}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;box-sizing:border-box}
  h1{margin:0;font-size:clamp(32px,7vw,64px);text-transform:uppercase;line-height:1}
  a{color:#fff;background:#D60000;padding:16px 28px;border-radius:64px;text-decoration:none;text-transform:uppercase;letter-spacing:.1em;font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Essa página não está aqui.</h1>
  <p>O endereço pode ter mudado.</p>
  <a id="home" href="./">Voltar ao site</a>
</main>
<script>
  // link "Voltar ao site" aponta para a raiz do site, mesmo publicado dentro de /<repositorio>/
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('github.io') && parts.length) document.getElementById('home').href = '/' + parts[0] + '/';
    else document.getElementById('home').href = '/';
  })();
</script>
</body>
</html>
